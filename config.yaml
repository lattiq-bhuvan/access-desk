logging:
  level: debug
  format: text


tracing:
  otlp_endpoint: "localhost:4317"   # the collector, NOT OpenObserve
  otlp_protocol: grpc
  stdout_exporter: true             # keep on until traces show up in OpenObserve

jwt:
  secret_key: "my-secret-key"
  access_token_ttl: 15m
  refresh_token_ttl: 24h
  issuer: accessdesk
  audience: ["accessdesk"]

database:
  driver: postgres
  host: localhost
  port: 5432
  database: mydatabase
  username: myuser
  password: mypassword
  options:
    sslmode: disable      # local Docker Postgres has no TLS
    log_level: warn       # GORM query logging defaults to warn, libraries should be silent
  pool:
    max_open: 10
    max_idle: 5
    max_lifetime: 30m
    max_idle_time: 5m


server:
  name: accessdesk
  mode: debug
  host: ""
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  cors:
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "OPTIONS"]
    allowed_headers: ["*"]