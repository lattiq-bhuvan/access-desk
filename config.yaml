logging:
  level: debug
  format: text
  report_caller: true


tracing:
  service_name: accessdesk
  service_version: development
  environment: development
  otlp_endpoint: ""
  sampling_rate: 1.0
  enabled: true
  stdout_exporter: true

jwt:
  secret_key: "my-secret-key"
  access_token_ttl: 15m
  refresh_token_ttl: 24h
  issuer: accessdesk
  audience: ["accessdesk"]

database:
  driver: postgres
  host: localhost
  port: 5432
  database: mydatabase
  username: myuser
  password: mypassword
  options:
    sslmode: disable      # local Docker Postgres has no TLS
    log_level: warn       # GORM query logging defaults to warn, libraries should be silent
  pool:
    max_open: 10
    max_idle: 5
    max_lifetime: 30m
    max_idle_time: 5m


server:
  name: accessdesk
  mode: debug
  host: ""
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  cors:
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "OPTIONS"]
    allowed_headers: ["*"]